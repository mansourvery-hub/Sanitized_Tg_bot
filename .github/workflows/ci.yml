name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pyright

      - name: Check code formatting (ruff format)
        run: ruff format --check generation.py app.py render_service.py sheerid_schools.py tests/

      - name: Lint code (ruff check)
        run: ruff check generation.py app.py render_service.py sheerid_schools.py tests/

      - name: Static type check (pyright)
        run: pyright generation.py app.py render_service.py sheerid_schools.py tests/

  test:
    name: Test & Validate (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: CLI smoke tests
        run: |
          python app.py list
          python app.py --target 1 --seed 42
          python app.py --target 2 --seed 42
          python app.py --target 3 --seed 42
          python app.py --target 4 --seed 42
          python app.py --target 5 --seed 42
